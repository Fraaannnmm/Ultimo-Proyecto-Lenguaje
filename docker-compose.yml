# =========================================================
#  ReservaUJAP — Orquestacion completa
#  Un solo comando:  docker compose up --build
#
#  Las credenciales se leen del archivo .env (no se sube a GitHub).
#  Si el .env no existe, se usan los valores de desarrollo que
#  aparecen despues de ":-" para que el sistema siempre levante.
# =========================================================

services:

  # ---------------- Bases de datos ----------------
  postgres:
    image: postgres:15-alpine
    container_name: ujap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ujap_admin}
      POSTGRES_PASSWORD: ${DB_PASS:-ujap_dev_pass}
      POSTGRES_DB: ${DB_NAME:-reservaujap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: ujap-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ujap_mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-ujap_dev_mongo}
    volumes:
      - mongodata:/data/db
    networks: [backend]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------- Microservicios ----------------
  servicio-python:
    build: ./servicio-python
    container_name: ujap-servicio-python
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${DB_USER:-ujap_admin}:${DB_PASS:-ujap_dev_pass}@postgres:5432/${DB_NAME:-reservaujap}
      SECRET_KEY: ${SECRET_KEY:-ujap-dev-secret-key-cambiar-en-produccion-0123456789}
      TOKEN_EXPIRY_MIN: ${TOKEN_EXPIRY_MIN:-120}
      SEED_PASSWORD: ${SEED_PASSWORD:-ujap2026}
    ports: ["8001:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  servicio-node:
    build: ./servicio-node
    container_name: ujap-servicio-node
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URL: mongodb://${MONGO_USER:-ujap_mongo}:${MONGO_PASS:-ujap_dev_mongo}@mongodb:27017/${MONGO_DB:-catalogo}?authSource=admin
      SECRET_KEY: ${SECRET_KEY:-ujap-dev-secret-key-cambiar-en-produccion-0123456789}
    ports: ["8002:3000"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  servicio-go:
    build: ./servicio-go
    container_name: ujap-servicio-go
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://${DB_USER:-ujap_admin}:${DB_PASS:-ujap_dev_pass}@postgres:5432/${DB_NAME:-reservaujap}?sslmode=disable
      CATALOGO_SERVICE_URL: http://servicio-node:3000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-ujap-dev-internal-key}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Caracas}
    ports: ["8004:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      servicio-node:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  servicio-java:
    build: ./servicio-java
    container_name: ujap-servicio-java
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-reservaujap}
      DB_USER: ${DB_USER:-ujap_admin}
      DB_PASS: ${DB_PASS:-ujap_dev_pass}
      AUTH_SERVICE_URL: http://servicio-python:8000
      CATALOGO_SERVICE_URL: http://servicio-node:3000
      REPORTES_SERVICE_URL: http://servicio-go:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-ujap-dev-internal-key}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Caracas}
    ports: ["8003:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      servicio-python:
        condition: service_healthy
      servicio-node:
        condition: service_healthy
      servicio-go:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ---------------- Frontend ----------------
  frontend:
    build: ./frontend
    container_name: ujap-frontend
    restart: unless-stopped
    ports: ["3000:80"]
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- API Gateway (Nginx) ----------------
  gateway:
    image: nginx:alpine
    container_name: ujap-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      servicio-python:
        condition: service_healthy
      servicio-node:
        condition: service_healthy
      servicio-java:
        condition: service_healthy
      servicio-go:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health/gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:

networks:
  backend:
  frontend:
