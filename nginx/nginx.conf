# =========================================================
#  ReservaUJAP — API Gateway (punto de entrada unico)
#  Todo entra por http://localhost y Nginx lo reparte:
#    /api/auth, /api/usuarios  -> servicio-python (FastAPI)
#    /api/espacios             -> servicio-node   (Express)
#    /api/reservas             -> servicio-java   (Spring Boot)
#    /api/reportes, /ws        -> servicio-go     (Gin)
#    /                         -> frontend
# =========================================================
events {}

http {
  upstream python_svc   { server servicio-python:8000; }
  upstream node_svc     { server servicio-node:3000;   }
  upstream java_svc     { server servicio-java:8080;   }
  upstream go_svc       { server servicio-go:8080;     }
  upstream frontend_app { server frontend:80;          }

  # Cabeceras comunes para todos los proxies
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  server {
    listen 80;
    client_max_body_size 2m;

    # ---------- Python: autenticacion JWT y usuarios ----------
    location /api/auth {
      proxy_pass http://python_svc/auth;
    }
    location /api/usuarios {
      proxy_pass http://python_svc/usuarios;
    }

    # ---------- Node: catalogo de espacios (MongoDB) ----------
    location /api/espacios {
      proxy_pass http://node_svc/espacios;
    }

    # ---------- Java: reservas (PostgreSQL) ----------
    location /api/reservas {
      proxy_pass http://java_svc/reservas;
    }

    # ---------- Go: reportes (PostgreSQL) ----------
    location /api/reportes {
      proxy_pass http://go_svc/reportes;
    }

    # ---------- Go: WebSocket de tiempo real ----------
    location /ws {
      proxy_pass http://go_svc/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---------- Estado de cada microservicio ----------
    location = /api/health/python { proxy_pass http://python_svc/health; }
    location = /api/health/node   { proxy_pass http://node_svc/health;   }
    location = /api/health/java   { proxy_pass http://java_svc/health;   }
    location = /api/health/go     { proxy_pass http://go_svc/health;     }
    location = /api/health/gateway {
      default_type application/json;
      return 200 '{"servicio":"gateway","estado":"ok"}';
    }

    # ---------- Frontend ----------
    location / {
      proxy_pass http://frontend_app;
    }
  }
}
