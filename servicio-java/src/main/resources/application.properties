# ReservaUJAP - Servicio de Reservas
# Todas las credenciales vienen de variables de entorno (docker-compose / .env)
spring.application.name=servicio-reservas
server.port=${PORT:8080}

# Al correr fuera de Docker lee el .env de la raiz del proyecto
spring.config.import=optional:file:../.env[.properties]

# ---------- PostgreSQL con Spring Data JPA ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- Otros microservicios ----------
app.servicios.auth-url=${AUTH_SERVICE_URL:http://servicio-python:8000}
app.servicios.catalogo-url=${CATALOGO_SERVICE_URL:http://servicio-node:3000}
app.servicios.reportes-url=${REPORTES_SERVICE_URL:http://servicio-go:8080}
app.servicios.internal-key=${INTERNAL_API_KEY}
app.zona-horaria=${APP_TIMEZONE:America/Caracas}
